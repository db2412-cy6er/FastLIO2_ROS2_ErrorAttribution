# lio_evaluation P2 误差归因阈值表 (Error Attribution)
# 规则实现单一事实源: scripts/attribution_rules.py (online node 与 offline --tune 共用)。
# 数值为初始候选, 需在 P2.2 用校准集 (corridor_run1 + fault injection) 离线标定后冻结。
# 调参流程: python3 scripts/attribution_validation.py <exp_dir> --tune --params <本文件>

attribution:
  # —— geometry 路 ——
  score_geom_th: 0.50            # /lio/health score 高于此 → 几何可观测性弱
  ratio_t_th: 0.10               # trans_ratio 低于此 → 平动弱约束 (P1.3 corridor 标定值)
  ratio_r_th: 0.02               # rot_ratio 低于此 → 转动弱约束 (P1 默认)

  # —— matching 路 ——
  feats_low_th: 100              # effective_feature_num 绝对下限 (辅助, 随场景泛化弱)
  feats_critical_th: 30          # 低于此直接判定匹配失败
  ratio_low_th: 0.30             # effective_feature_ratio 低于此 → 有效占比不足 (相对指标为主)
  residual_high_th: 0.10         # mean_residual 高于此 → 残差异常 (m)
  residual_p90_th: 0.20          # residual_p90 高于此 → 局部匹配恶化 (m, 对退化更敏感)
  ratio_drop_th: 0.50            # 相对滚动基线的有效占比骤降阈值 (如 dropout 后 ratio 跌一半)
  num_drop_th: 0.50              # 相对滚动基线的有效特征数骤降阈值
  ratio_baseline_window_s: 10.0  # 滚动基线窗口 (s, 用于相对骤降判定)

  # —— IMU 路 ——
  gyr_exc_th: 0.05               # imu_gyr_excitation 低于此 → 转动激励不足 (rad/s, 需实测噪声校准)
  acc_exc_th: 0.15               # imu_acc_excitation 低于此 → 平动动态激励不足 (m/s^2)

  # —— filter 路 (v1 仅辅助确认, 不单独触发) ——
  cov_pos_high_th: 1.0e-2        # pos_cov_trace 高于此 → 位置不确定度高 (m^2, 量级需按场景校准)

  # —— 主标签 tie-break 优先级 (label=argmax severity; 并列时按此顺序取) ——
  priority:
    - CORRESPONDENCE_FAILURE
    - GEOMETRY_DEGENERATION
    - IMU_WEAK_EXCITATION
    - NORMAL
